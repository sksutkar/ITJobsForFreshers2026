<section class="section-block internship-section" id="internships">
  <div class="container">
    <div class="section-heading">
      <div><span class="section-kicker">Learn by doing</span><h2>Internships to grow your skills</h2><p>Discover sample placements in development, web and data.</p></div>
      <a class="text-link desktop-link" routerLink="/internships">Browse internships <i class="bi bi-arrow-right"></i></a>
    </div>
    <div class="job-grid"><app-job-card *ngFor="let job of jobs" [job]="job"></app-job-card></div>
  </div>
</section>
