<header class="site-header">
  <div class="container header-inner">
    <a class="brand" routerLink="/" aria-label="ITJobsForFreshers.com home" (click)="closeMenu()">
      <span class="brand-mark"><i class="bi bi-braces-asterisk" aria-hidden="true"></i></span>
      <span class="brand-copy"><strong>ITJobs<span>ForFreshers</span>.com</strong><small>Your Dream IT Job Starts Here.</small></span>
    </a>
    <button class="menu-toggle" type="button" aria-label="Toggle navigation" [attr.aria-expanded]="menuOpen" (click)="menuOpen = !menuOpen">
      <i class="bi" [ngClass]="menuOpen ? 'bi-x-lg' : 'bi-list'" aria-hidden="true"></i>
    </button>
    <nav class="main-nav" [class.open]="menuOpen" aria-label="Main navigation">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Home</a>
      <a routerLink="/jobs" routerLinkActive="active" (click)="closeMenu()">Latest Jobs</a>
      <a routerLink="/fresher-jobs" routerLinkActive="active" (click)="closeMenu()">Fresher Jobs</a>
      <a routerLink="/off-campus" routerLinkActive="active" (click)="closeMenu()">Off-Campus</a>
      <a routerLink="/internships" routerLinkActive="active" (click)="closeMenu()">Internships</a>
      <a routerLink="/interview-questions" routerLinkActive="active" (click)="closeMenu()">Interview Prep</a>
      <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">About Us</a>
      <a class="nav-search" routerLink="/jobs" aria-label="Search jobs" (click)="closeMenu()"><i class="bi bi-search" aria-hidden="true"></i></a>
    </nav>
  </div>
</header>
